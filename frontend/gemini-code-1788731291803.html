<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Skin Barber - Catálogo</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="noise-overlay"></div>
  
  <main class="catalog-wrapper">
    <header class="catalog-header">
      <h1 class="brand-title">SERVIÇOS</h1>
      <p class="brand-subtitle">ESCOLHA SEU ESTILO</p>
    </header>

    <section id="services-grid" class="services-container">
      <!-- Cards renderizados dinamicamente via JS -->
    </section>
  </main>

  <footer class="action-footer">
    <div class="total-display">Total: <span id="cart-total">R$ 0,00</span></div>
    <button id="btn-next" class="submit-btn" disabled>Avançar</button>
  </footer>

  <script type="module" src="script.js"></script>
</body>
</html>
